workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter packages pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS simulator app
        script: |
          flutter build ios --simulator --debug
          echo "--- Finding Runner.app ---"
          find build/ios -name "Runner.app" -type d
          RUNNER_PATH=$(find build/ios -name "Runner.app" -type d | head -1)
          RUNNER_DIR=$(dirname "$RUNNER_PATH")
          cd "$RUNNER_DIR"
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r tessera-simulator.zip Payload/
          echo "--- zip created at: $RUNNER_DIR/tessera-simulator.zip ---"
    artifacts:
      - build/ios/**/tessera-simulator.zip